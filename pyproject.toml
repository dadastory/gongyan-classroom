[project]
name = "gongyan-classroom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.2",
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "transitions>=0.9.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "huawei"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
test = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
